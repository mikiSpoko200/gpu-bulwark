[package]
name = "gpu-bulwark"
version = "0.1.0"
edition = "2021"

[dependencies]
glb = { version = "0.14.0", package = "gl" }
thiserror = "1.0.49"

nalgebra-glm = { version = "0.18.0", optional = true } 
nalgebra = { version = "0.32.5", optional = true }

hi = { path = "himark", package = "himark" }
dm = { version = "0.99.18", package = "derive_more" }
concat-idents = "1.1.5"

[features]
default = ["nalgebra-glm"]
nalgebra = ["dep:nalgebra"]
nalgebra-glm = ["dep:nalgebra-glm"]

direct_state_access = []
opengl46 = ["direct_state_access"]


[dev-dependencies]
glutin-winit = "0.5" 
glutin = "0.32.0"
raw-window-handle = "0.6"
winit = "0.30.0"
anyhow = "1.0.75"
image = "0.25.2"
slice-of-array = "0.3.2"